name: Upstream Sync

on:
  schedule:
    # Run daily at 05:00 AM IST (23:30 UTC previous day)
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      build_apks:
        description: 'Rebuild APKs after sync'
        required: true
        type: boolean
        default: true
      push_changes:
        description: 'Push changes directly to main'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git || true

      - name: Run Upstream Sync
        run: |
          BUILD_FLAG=""
          if [ "${{ github.event.inputs.build_apks }}" = "false" ]; then
            BUILD_FLAG="--no-build"
          fi
          ./tools/firetv/sync-upstream.sh --remote upstream --branch main $BUILD_FLAG

      - name: Check for changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push (if enabled)
        if: steps.git_status.outputs.has_changes == 'true' && (github.event.inputs.push_changes == 'true' || github.event_name == 'schedule')
        run: |
          git add -A
          git commit -m "chore(sync): automated upstream CleanYourTV synchronization"
          git push origin main
